<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="index.css">
    <script src='https://unpkg.com/boxicons@2.1.4/dist/boxicons.js'></script>
</head>
<body>
    <section id="Paulo" class="max-w-[1920px] mx-auto px-6 sm:px-12 xl:px-40 py-12 xl:py-20">

        <div class="relative inline-block mb-10 xl:mb-16">
                <h2 class="text-3xl xl:text-[48px] font-black tracking-tighter text-black">NEW ARRIVALS</h2>
                <img src="./assets/imagem1.png" alt="Imagem1" class="absolute right-0 bottom-0 xl:bottom-1 w-28 xl:w-44 -z-10">
        </div>

        < class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 xl:gap-12">

            <div class=" flex flex-col group cursor-pointer">
                <img src="./assets/Hoodies & Sweetshirt.png" alt="Hoodies & Seeetshirt" class="w-full h-auto object-cover rounded-[20px]">

                    <div class="flex justify-between items-center mt-5">
                        <div>
                            <h2>Hoodies & Seeetshirt</h2>
                            <p class="text-sm xl-text-base font-medium text-neutral-500 mt-1">Explore Now!></p>
                        </div>
                            <a href="" class="text-neutral-900 transition-transform group-hover:translate-x-1">
                            <box-icon name="right-arrow-alt" size="md"></box-icon>
                            </a>
                    </div>  
            </div>
            <div class=" flex flex-col group cursor-pointer">
                <img src="./assets/Coats&Parkas.png" alt="Coats & Parkas" class="w-full h-auto object-cover rounded-[20px]">

                    <div class="flex justify-between items-center mt-5">
                        <div>
                            <h2>Coats & Parkas</h2>
                            <p class="text-sm xl-text-base font-medium text-neutral-500 mt-1">Explore Now!></p>
                        </div>
                            <a href="" class="text-neutral-900 transition-transform group-hover:translate-x-1">
                            <box-icon name="right-arrow-alt" size="md"></box-icon>
                            </a>
                    </div>  
            </div>
            <div class=" flex flex-col group cursor-pointer">
                <img src="./assets/Tees & T-Shirt.png" alt="Tees & T-Shirt" class="w-full h-auto object-cover rounded-[20px]">

                    <div class="flex justify-between items-center mt-5">
                        <div>
                            <h2>Tees & T-Shirt</h2>
                            <p class="text-sm xl-text-base font-medium text-neutral-500 mt-1">Explore Now!></p>
                        </div>
                            <a href="" class="text-neutral-900 transition-transform group-hover:translate-x-1">
                            <box-icon name="right-arrow-alt" size="md"></box-icon>
                            </a>
                    </div>  
            </div>
        </div>
    </section>
</body>
</html>
