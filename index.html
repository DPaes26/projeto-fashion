<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <section id="Danielly">
        <header class="flex justify-between items-center px-6 py-6 lg:px-[100px] lg:pt-[50px] max-w-[1920px] mx-auto">
            <a href="" alt="logo-vetor" class="flex items-center gap-[13px] font-black">
                <img src="./assets/Vector.png" alt="" class="w-[28px] h-[26px] lg:w-[31px] lg:h-[29px]">
                <span class="font-black text-xl lg:text-2xl tracking-wider text-black">FASHION</span>
            </a>
            <!-- Menu: Oculto no telemóvel (hidden), visível a partir de ecras médios/grandes -->
            <nav class="hidden md:flex items-center gap-8 lg:gap-16">
                <a href="" class="text-xs lg:text-sm font-medium text-black hover:opacity-75 transition">CATALOGUE</a>
                <a href="" class="text-xs lg:text-sm font-medium text-black hover:opacity-75 transition">FASHION</a>
                <a href="" class="text-xs lg:text-sm font-medium text-black hover:opacity-75 transition">FAVOURITE</a>
                <a href="" class="text-xs lg:text-sm font-medium text-black hover:opacity-75 transition">LIFESTYLE</a>
                <a href=""
                    class="bg-black text-white text-xs lg:text-sm font-medium rounded-[7px] px-4 py-2 lg:px-[22px] lg:py-[15px] hover:bg-neutral-800 transition">SIGN
                    UP</a>
            </nav>
        </header>
        <!-- Seção Hero (Card Principal) -->
        <main class="px-4 sm:px-6 lg:px-[100px] pb-12 lg:pb-16 max-w-[1920px] mx-auto">
            <div
                class=" bg-[#f4f6f5] rounded-[30px] lg:rounded-[50px] flex flex-col lg:flex-row items-center justify-between px-6 py-10 lg:px-20 lg:py-0 overflow-hidden relative min-h-[500px] lg:min-h-[852px]">
                <!-- Coluna da Esquerda: Textos e Botão -->
                <div
                    class="w-full lg:max-w-[474px] flex flex-col items-center lg:items-start text-center lg:text-left z-10">
                    <!-- Título Responsivo -->
                    <h1
                        class="text-4xl sm:text-[96px] leading-[1.15] lg:leading-[120px] font-black font-['Poppins'] tracking-tight">
                        <span
                            class="relative inline-block z-10 before:content-[''] before:absolute before:inset-0 before:bg-white before:-z-10 before:-rotate-2 before:rounded-sm px-2">LET’S</span>
                        <br>
                        EXPLORE
                        <br>
                        <span
                            class="relative inline-block z-10 before:content-[''] before:absolute before:inset-0 before:bg-[#EBD96B] before:-z-10 before:-rotate-2 before:rounded-sm px-2">
                            UNIQUE
                        </span>
                        CLOTHES.
                    </h1>
                    <!-- Subtítulo -->
                    <p class="mt-4 lg:mt-6 text-gray-600 text-sm sm:text-base lg:text-xl font-normal max-w-sm">Live for
                        Influential and Innovative fashion!</p>
                    <!-- Botão Shop Now -->
                    <div class="mt-6 lg:mt-8">
                        <a href=""
                            class="inline-flex items-center justify-center bg-black text-white text-sm lg:text-lg font-medium px-6 py-3 lg:px-9 lg:py-4 rounded-[10px] hover:bg-neutral-800 transition">Shop
                            Now</a>
                    </div>
                </div>

                <!-- Coluna da Direita: Imagem da Modelo -->
                <div class="w-full lg:w-1/2 flex justify-between lg:justify-end items-end mt-8 lg:mt-0">
                    <img src="./assets/girl.png" alt="Modelo"
                        class="max-h-[380px] sm:max-h-[500px] lg:max-h-[750px] object-contain">
                </div>
            </div>
        </main>

        <div class="bg-[#EBD96B] w-full py-10 lg:py-[55px]">
            <div
                class=" max-w-[1920px] px-6 mx-auto justify-center lg:px-[100px] flex items-center flex-wrap gap-8 xl:justify-between lg:gap-0">
                <img src="./assets/Rectangle 36.png" alt="H&M" class="mix-blend-multiply object-contain">
                <img src="./assets/Rectangle 44.png" alt="OBEY" class="mix-blend-multiply object-contain">
                <img src="./assets/Rectangle 38.png" alt="Shopify" class="mix-blend-multiply object-contain">
                <img src="./assets/Rectangle 45.png" alt="Lacoste" class="mix-blend-multiply object-contain">
                <img src="./assets/Rectangle 43.png" alt="Levi's" class="mix-blend-multiply object-contain">
                <img src="./assets/Rectangle 41.png" alt="Amazon" class="mix-blend-multiply object-contain">
            </div>
        </div>
    </section>

</body>

</html>
