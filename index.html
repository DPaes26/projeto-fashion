<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <section id="mayara" class="max-w-6xl mx-auto px-4 py-8">

    <div class="mb-10 relative inline-block">
      <h2 class="font-['Poppins'] font-black text-[27.17px] text-black relative z-10">
        Young’s Favourite
      </h2>
      <span class="absolute bottom-0 right-0 w-[170px] h-[12px] bg-[#EBD96B] -z-0 rounded-full"></span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-[47px]">

      <div class="flex flex-col gap-3">
        <img src="./img/img-girls.png" alt="Trending on instagram" class="w-full h-[384px] object-cover rounded-[20px]">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="font-bold text-xl text-black">Trending on instagram</h3>
            <a href="#" class="text-gray-500 text-sm hover:underline">Explore Now!</a>
          </div>
          <span class="border-2 border-[#797979] px-2 py-1 rounded text-black">→</span>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <img src="./img/img-girl.png" alt="All Under $40" class="w-full h-[384px] object-cover rounded-[20px]">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="font-bold text-xl text-black">All Under $40</h3>
            <a href="#" class="text-gray-500 text-sm hover:underline">Explore Now!</a>
          </div>
          <span class="border-2 border-[#797979] px-2 py-1 rounded text-black">→</span>
        </div>
      </div>

    </div>

  </section>

</body>
</html>
